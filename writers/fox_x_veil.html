<script>
  document.addEventListener('DOMContentLoaded', () => {
    qSel('.back').innerHTML = rp
  })

  function chatText(clas='bright', name='', text='put some text here') {
    return `<p class="chat_message"><span class="user">{<span class="${clas}">${name}</span>}</span> ${text}</p><br>`
  }

  function fox(text='uwu') {
    return chatText('foxvale', 'fox', text)
  }
  function veil(text='') {
    return chatText('valefox', 'veil', text)
  }
  function prokid(text='') {
    return chatText('prokid', 'prokid', text)
  }

  let rp = `<br>` +
  prokid(`<span class="dull">don't mind me, leaking some rp dms :Pc</span><br>`)+
  fox()+
  veil()

</script>
