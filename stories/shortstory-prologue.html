var shortstory = [
`
<h1 style="text-align: center">Content Warning</h1>
<div class='background' style="text-align: center">\
    Content in this story contains but is not limited to:
    <br>
    <br>
    <strong>I'll write them here when they come up :\u2184</strong>

header2('1') +
`
<h1 id='char' class=\"Character\">Lillian</h1>\
<div class='background'>\
    <p><i>On the final day of school, every student disappears except you.
    Their bags remain beneath their desks. Their unfinished work lies open. Food still sits in the cafeteria, warm and untouched.
    But the teachers continue the school day as though nothing unusual has happened.
    They teach lessons to empty classrooms. They scold invisible students for whispering. At lunchtime, they supervise a silent cafeteria filled with vacant chairs.
    Whenever you ask where everyone went, the teachers simply smile and tell you to return to class.
    During the final lesson, your teacher begins attendance.
    She calls every missing student's name.
    After each one, she pauses and listens.
    "Present," she whispers, answering for them.
    Finally, she reaches your name.
    The classroom door locks.
    The blinds close by themselves.
    Your teacher places a black graduation cap on her desk and smiles.
    "Now that the others have graduated," she says, "it's finally your turn."
    From somewhere beneath the floor, hundreds of voices begin repeating your name.
    Then the empty desks slowly turn to face you.</i>


    I shoot out of bed, covered in a cold sweat. My hand clutches at the heart trying to beat out of my chest.

    I try to turn my gasps into bigger gulps of air.

    Why did that nightmare happen? The last day of school is only a week away. And...

    And graduating isn't really what I'm worried about.

    I glance at the suitcase full of clothes and other stuff I would need if I were to leave this house.

    My school day starts with me waking up, doing all the shit I have to do to be ready for school, yelling a goodbye to my parents, giving them a quick response if they say something, and walking to school.

    They won't notice me dragging a roller suitcase with me.

    Even if they do, I can just say there's a project in it or something.

    The next part of the plan comes later.

    But, right now, my clock says 5:00 am. Almost two full hours before I have to be at school.

    Couldn't hurt to look through what I packed, right?

    Make sure I have everything.

    This is the first trip, so it's the most important. This suitcase needs to have enough of the right stuff to keep me going for a while.

    Toothbrush, backup toothbrush, two tubes of toothpaste (one opened, one in the package), about a week's worth of clothes, some of my favorite books, a charger for my phone, my personal laptop, a charger for that...

    I spent an hour looking through that bag. I knew exactly what was in there, but I checked it all again and again.

    I spend another half hour glancing around my room to see if I should throw anything else in the pack.

    Then I need to take a shower and eat breakfast and make sure my school backpack is ready and hop out the door.

    I'm stressed out of my mind as I pull the suitcase to the door.

    I shout "Bye!" to the other people in the house.

    I jump high enough to land on my own shoulders when someone- my mom- shouts a "Goodbye" down at me.

    I leave quickly, successfully making it out of the house with my bags.

    Then... I go to school.

    It looks like the same shitty old building I go to every day. It's not exactly pretty, but it has people I care about.

    Not related to learning, of course. We spend plenty of classes just talking, spend gym class together doing things the school would sure as hell suspend us for.

    But they haven't caught us yet.

    Our first class is together, and I walk up to her while she hangs her backpack on a hook.

    "Hey, Des."

    She straightens up and then melts toward me for a hug.

    "Hi!"

    She just... holds me for a moment.

    "I see you have the goods."

    I roll the bag from behind to in front of me and say "Where should I put it?"

    Des takes the handle, putting her hand over mine on the one-hand-wide bar.

    She slides it under her backpack and pulls my hand in the direction of our first class. Her sweater's sleeves are long enough to cover her palm.

    "Come on! We can't be late for talking class."</p></div>`,

    header2('2') +
    header1('Lillian') +
    background(
      paragraph(`After the school day, I ride with Des back to her house. We've got some shenanigans to get up to.

      We loaded the roller bag into the trunk of her mom's car, which we now pull out and drag into the house.

      Des starts hauling it up the stairs to her room.
      "H-hey, are we going to share a room?"

      She glances back at me.
      "Of course we are. Grab the bottom there-"

      It takes us a bunch of swears, misinterpreted directions and bumps to get it up the one thing this suitcase was never meant to ascend.

      I'm no stranger to Des' room; I see it more than my own these days.
      Desk with a computer, a sparse calendar, bed, bookshelf, closet.
      Big lesbian flag on the wall, perfectly placed so it's the first thing you see when you look through the door.

      I have plenty of experience sitting and laying on her bed, but...
      Is the plan for me to sleep in it?
      With her?

      I-I'm not against it, not at all. I just-
      I need to get up the courage to ask her about it.

      What does it feel like?
      I know I probably slept with my parents at some point, but it's been a really long time.
      And-and my relationship with her is way different.

      ...I have a whole week to figure this stuff out.

      ...I hope that's enough.

      We spend the rest of the day talking, playing games, me introducing Des to Friday Night Funkin'. She's stupidly good at metroidvanias and RPGs and singleplayer stuff like that, but I found out that she's never tried a rhythm game.

      So, of course, I pulled out my phone to full clear Weekend 1

      and then she made me try on her computer

      and I got about 60%

      after changing my controls and delay
      teaching her about delay was fun. she started doing better after she changed it

      not as good as me of course >:)

      and then she got to pico and said "I have to full clear this"

      and after an hour

      she fcking did it

      not SS, just full clear, but holy shit
      she started playing this game <i>today</i>

      how is she so good at adapting to stuff?
      or did she just bash her head into a wall until it broke

      "Not quite, I bash my head a the wall a few times and observe which bashes worked best. Then I do that a few times, look at what works best there, and keep acting, observing, and reacting."

      "How would that work, for like, Touhou?"

      "What's Toho?"

      yea then I showed her touhou
      she's working on 6
    `), false),

    header1('Afterword')+
    background(
        paragraph('<img src="/writers/foxvale16.png"> haiii! foxvale again!') +
        paragraph(``) +
        paragraph(``) +

        linebreak() +
        paragraph(`More stuff about these two:
        write some chat stuff (${addlink('/stories/shortstory-chat.html', 'here!', false)})
        `) +


        ``, false
    )

        // paragraph(``) +
]
</script>
